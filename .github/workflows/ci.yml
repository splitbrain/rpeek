name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least-privilege default; the release job widens this for itself.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  release:
    name: Release
    needs: test
    # Only build and publish binaries for tag pushes (e.g. v1.2.3).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64:Linux_x86_64 linux/arm64:Linux_aarch64 \
                        darwin/amd64:Darwin_x86_64 darwin/arm64:Darwin_arm64; do
            platform=${target%%:*}
            name=${target#*:}
            os=${platform%/*}
            arch=${platform#*/}
            echo "Building ${os}/${arch} as ${name}"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X rpeek/internal/version.Version=${VERSION}" \
                -o rpeek ./cmd/rpeek
            tar -czf "dist/rpeek_${name}.tar.gz" rpeek README.md
            rm -f rpeek
          done
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS )

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
